name: Isolated native update acceptance
on:
  push:
    branches: [qa/in-app-update-runtime, claude/project-thread-vfmygh]
  workflow_dispatch:
    inputs:
      suite:
        description: Runtime acceptance scope
        type: choice
        options: [all, occupied]
        default: all
permissions:
  contents: read
concurrency:
  group: yomado-update-runtime-acceptance
  cancel-in-progress: false
jobs:
  update-runtime:
    runs-on: [hayabuild-macos, vm]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: TEMP diagnose disposable VM (remove before ready)
        shell: bash
        run: |
          id; sw_vers; csrutil status || true
          echo "HAYABUILD_DISPOSABLE_VM=${HAYABUILD_DISPOSABLE_VM:-} RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-}"
          sudo -n security authorizationdb read com.apple.trust-settings.admin 2>&1 | grep -A1 -E '<key>(rule|class)</key>' || true
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=hb-diag -keyout "$RUNNER_TEMP/d.key" -out "$RUNNER_TEMP/d.crt" 2>/dev/null
          ( sudo -n security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/d.crt" & p=$!; sleep 20; kill $p 2>/dev/null && echo "add-trusted-cert still running after 20 s"; wait $p; echo "exit $?" )
          ps -axo pid,user,comm | grep -i -E 'SecurityAgent|authorizationhost' | grep -v grep || true
          sudo -n security remove-trusted-cert -d "$RUNNER_TEMP/d.crt" 2>&1 || true
      - name: Record exact revision and run isolated update fixtures
        shell: bash
        env:
          YM_UPDATE_RUNTIME_CASE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}
        run: |
          mkdir -p test-output/update-runtime
          git rev-parse HEAD > test-output/update-runtime/revision.txt
          git diff --exit-code
          bash scripts/test-update-runtime.sh "$GITHUB_WORKSPACE/test-output/update-runtime"
      - name: Collect acceptance evidence, excluding keys and application bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-update-runtime
          path: |
            test-output/update-runtime/
            !test-output/update-runtime/UpdateRuntimeFixture
            !test-output/update-runtime/UpdateRuntimeWindow
          retention-days: 7
